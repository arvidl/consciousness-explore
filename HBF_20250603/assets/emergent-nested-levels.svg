<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="800" fill="white" stroke="black" stroke-width="3"/>

  <!-- Title -->
  <text x="700" y="80" text-anchor="middle" font-size="48" font-weight="bold" fill="#4CAF50">EMERGENT NESTED LEVELS</text>

  <!-- Brain outline
  <path d="M 200 300 Q 200 200, 300 150 Q 400 100, 500 120 Q 600 140, 650 200 Q 700 260, 680 320 Q 660 380, 600 420 Q 550 460, 480 480 Q 420 500, 360 480 Q 300 460, 250 400 Q 200 340, 200 300"
        fill="none" stroke="#999" stroke-width="3" opacity="0.5"/>

  # Additional brain convolutions
  <path d="M 300 250 Q 350 230, 400 240 Q 450 250, 480 280" fill="none" stroke="#999" stroke-width="2" opacity="0.4"/>
  <path d="M 350 350 Q 400 340, 450 350 Q 500 360, 520 380" fill="none" stroke="#999" stroke-width="2" opacity="0.4"/>
  -->

  <!-- Green dotted rectangles for levels
  <rect x="100" y="50" width="1200" height="700" fill="none" stroke="#4CAF50" stroke-width="2" stroke-dasharray="10,5" opacity="0.6"/>
  <rect x="150" y="280" width="1100" height="420" fill="none" stroke="#4CAF50" stroke-width="2" stroke-dasharray="10,5" opacity="0.6"/>
  <rect x="200" y="480" width="1000" height="180" fill="none" stroke="#4CAF50" stroke-width="2" stroke-dasharray="10,5" opacity="0.6"/>
  -->

  <!-- Horizontal dividing lines -->
  <line x1="150" y1="250" x2="1250" y2="250" stroke="#999" stroke-width="1" stroke-dasharray="8,4"/>
  <line x1="150" y1="370" x2="1250" y2="370" stroke="#999" stroke-width="1" stroke-dasharray="8,4"/>
  <line x1="150" y1="480" x2="1250" y2="480" stroke="#999" stroke-width="1" stroke-dasharray="8,4"/>
  <line x1="150" y1="590" x2="1250" y2="590" stroke="#999" stroke-width="1" stroke-dasharray="8,4"/>

  <!-- Brain region labels (red) -->
  <text x="550" y="140" text-anchor="middle" font-size="20" font-weight="bold" fill="#E53935">CORTEX</text>
  <text x="550" y="165" text-anchor="middle" font-size="20" font-weight="bold" fill="#E53935">&amp;</text>
  <text x="550" y="190" text-anchor="middle" font-size="20" font-weight="bold" fill="#E53935">THALAMUS</text>

  <text x="520" y="430" text-anchor="middle" font-size="20" font-weight="bold" fill="#E53935">UPPER BRAINSTEM &amp;</text>
  <text x="520" y="455" text-anchor="middle" font-size="20" font-weight="bold" fill="#E53935">ASCENDING ACTIVATING</text>
  <text x="520" y="480" text-anchor="middle" font-size="20" font-weight="bold" fill="#E53935">(RETICULAR) SYSTEM</text>

  <text x="520" y="640" text-anchor="middle" font-size="20" font-weight="bold" fill="#E53935">LOWER BRAINSTEM</text>
  <text x="520" y="665" text-anchor="middle" font-size="20" font-weight="bold" fill="#E53935">&amp;</text>
  <text x="520" y="690" text-anchor="middle" font-size="20" font-weight="bold" fill="#E53935">SPINAL CORD</text>

  <!-- Consciousness level labels (green) -->
  <text x="800" y="170" text-anchor="middle" font-size="24" font-weight="bold" fill="#4CAF50">EXTENDED CONSCIOUSNESS</text>
  <text x="800" y="430" text-anchor="middle" font-size="24" font-weight="bold" fill="#4CAF50">CORE CONSCIOUSNESS</text>
  <text x="800" y="660" text-anchor="middle" font-size="24" font-weight="bold" fill="#4CAF50">PROTOSELF</text>

  <!-- Extended Consciousness components -->
  <text x="600" y="320" text-anchor="middle" font-size="18" fill="black">Working Memory</text>
  <text x="800" y="320" text-anchor="middle" font-size="18" fill="black">Reasoning</text>
  <text x="980" y="320" text-anchor="middle" font-size="18" fill="black">Language</text>
  <text x="1150" y="320" text-anchor="middle" font-size="18" fill="black">Other Memory</text>
  <text x="1150" y="380" text-anchor="middle" font-size="18" fill="black">Intelligence</text>

  <!-- Core Consciousness components -->
  <text x="650" y="540" text-anchor="middle" font-size="18" fill="black">Attention</text>
  <text x="850" y="540" text-anchor="middle" font-size="18" fill="black">Wakefulness</text>
  <text x="1050" y="540" text-anchor="middle" font-size="18" fill="black">Mental Imagery</text>

  <!-- Protoself description -->
  <text x="800" y="700" text-anchor="middle" font-size="18" fill="black">Homeostatic and vital somatic functions</text>

  <!-- Right-side labels -->
  <text x="1280" y="430" text-anchor="middle" font-size="20" fill="black">EMOTION</text>
  <text x="1280" y="560" text-anchor="middle" font-size="20" fill="black">AWARENESS</text>
  <text x="1280" y="700" text-anchor="middle" font-size="20" fill="black">FEELING</text>

  <!-- Arrows -->
  <!-- From Extended to Core components -->
  <path d="M 600 340 L 650 400" stroke="black" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 800 340 L 800 400" stroke="black" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 980 340 L 930 400" stroke="black" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1150 340 L 1050 400" stroke="black" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- From Core to Proto components -->
  <path d="M 650 520 L 700 440" stroke="black" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 850 520 L 850 440" stroke="black" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1050 520 L 1000 440" stroke="black" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Between Extended components -->
  <path d="M 700 180 L 600 300" stroke="black" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 780 180 L 800 300" stroke="black" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 850 180 L 980 300" stroke="black" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 900 180 L 1150 300" stroke="black" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Blue box -->
  <rect x="1175" y="115" width="220" height="80" fill="white" stroke="#1976D2" stroke-width="3"/>
  <path d="M 1200 140 L 1250 140" stroke="#1976D2" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="1285" y="160" text-anchor="middle" font-size="18" fill="black">Necessary Process for</text>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1976D2"/>
    </marker>
  </defs>
</svg>
